<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jacques+Francois&family=Jersey+25&display=swap" rel="stylesheet">
    <style>
        .bg-dark-blue { background-color: #1a2035; }
        body { font-family: 'Jersey 25', sans-serif; }
        nav { font-family: 'Jacques Francois', sans-serif; }
        .input-box {
            border: 1px solid #9ca3af;
            border-radius: 0.375rem;
            height: 1.75rem;
            padding-left: 0.5rem;
            outline: none;
            width: 100%;
        }
        .no-spinner::-webkit-outer-spin-button,
        .no-spinner::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }        
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col">

    <div id="alert_wrapper" class="fixed top-4 left-1/2 -translate-x-1/2 transform transition-all duration-300 opacity-0 -translate-y-4 pointer-events-none z-50">
        <div id="alert_box" class="px-4 py-2 rounded-xl shadow-lg text-sm font-medium"></div>
    </div>

    <nav class="bg-black text-white p-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <span class="text-xl font-bold mr-6">Movie</span>
                <div class="relative flex items-center bg-gray-700 rounded-lg">
                    <select class="bg-gray-700 text-white p-2 rounded-l-lg focus:outline-none text-sm">
                        <option>All</option>
                    </select>
                    <input type="text" class="bg-gray-800 text-white p-2 w-64 focus:outline-none text-sm"/>
                    <button class="p-2 rounded-r-lg bg-gray-800 flex items-center justify-center group transition-colors duration-200 hover:bg-gray-700">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="space-x-4">
                <a href="advanced_search.html" class="text-gray-300 hover:text-white text-sm">Advanced Search</a>
                <a id="auth_link" href="sign_in.html" class="bg-gray-600 hover:bg-gray-500 text-white px-3 py-1.5 rounded-lg text-sm">Sign In</a>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-8 py-12 w-full">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-20 gap-y-12 items-start">

            <section>
                <h2 class="text-4xl font-bold mb-6 border-l-4 border-black pl-3 flex items-center">Movie</h2>
                <div class="space-y-4 pl-2 text-lg">
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Language</label>
                        <div class="w-48">
                            <div class="relative w-16">
                                <select id="input_movie_language" class="hover:bg-gray-800 h-8 appearance-none w-full bg-black text-white px-2 py-0.5 rounded-lg text-xs border-none focus:outline-none cursor-pointer">
                                    <option value="">NaN</option>
                                    <option value="En">En</option>
                                    <option value="Ch">Ch</option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-white">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Duration</label>
                        <div class="w-48 flex">
                            <div class="relative w-16 flex-none">
                                <select id="input_movie_duration_op" class="hover:bg-gray-800 h-8 appearance-none w-full bg-black text-white px-2 py-0.5 rounded-l-lg text-xs border-none focus:outline-none cursor-pointer">
                                    <option value="gt"> &gt; </option>
                                    <option value="lt"> &lt; </option>
                                    <option value="eq"> = </option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-white">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </div>
                            <input id="input_movie_duration_value" placeholder="Enter mins" type="number" class="input-box no-spinner h-8 w-full rounded-l-none rounded-r-lg"> 
                        </div>                            
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Release Year</label>
                        <div class="w-48">
                            <input id="input_movie_release_year" placeholder="Enter year" type="number" min="1900" max="2099" class="input-box h-8 rounded-lg">
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Director</label>
                        <div class="w-48">
                            <input id="input_movie_director" type="text" class="input-box h-8 rounded-lg">
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Country</label>
                        <div class="h-8 w-48">
                            <input id="input_movie_country" type="text" class="input-box h-8 rounded-lg">
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Title</label>
                        <div class="h-8 w-48">
                            <input id="input_movie_title" type="text" class="input-box h-8 rounded-lg">
                        </div>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-4xl font-bold mb-6 border-l-4 border-black pl-3 flex items-center">Actor</h2>
                <div class="space-y-4 pl-2 text-lg">
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Gender</label>
                        <div class="w-48">
                            <div class="relative w-16">
                                <select id="input_actor_gender" class="hover:bg-gray-800 h-8 appearance-none w-full bg-black text-white px-2 py-0.5 rounded-lg text-xs border-none focus:outline-none cursor-pointer">
                                    <option value="">NaN</option>
                                    <option value="M"> M </option>
                                    <option value="F"> F </option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-white">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Birth Year</label>
                        <div class="w-48">
                            <input id="input_actor_birth_year" placeholder="Enter year" type="number" min="1900" max="2099" class="input-box h-8 rounded-lg">
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Nationality</label>
                        <div class="w-48">
                            <input id="input_actor_nationality" type="text" class="input-box h-8 rounded-lg">
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Name</label>
                        <div class="w-48">
                            <input id="input_actor_name" type="text" class="input-box h-8 rounded-lg">
                        </div>
                    </div>
                </div>
            </section>
        </div>
    
        <hr class="w-full max-w-5xl mx-auto my-12 border-t-2 border-gray-300">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-20 gap-y-12 items-start">
            <section class="mt-2">
                <h2 class="text-4xl font-bold mb-6 border-l-4 border-black pl-3 flex items-center">Company</h2>
                <div class="space-y-4 pl-2 text-lg">
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Founded Year</label>
                        <div class="w-48">
                            <input id="input_company_founded_year" placeholder="Enter year" type="number" min="1895" max="2099" class="input-box h-8 rounded-lg">
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Name</label>
                        <div class="w-48">
                            <input id="input_company_name" type="text" class="input-box h-8 rounded-lg">
                        </div>
                    </div>
                </div>
            </section>

            <section class="-mt-2">
                <h2 class="text-4xl font-bold mb-6 border-l-4 border-black pl-3 flex items-center">Director</h2>
                <div class="space-y-4 pl-2 text-lg">
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Birth Year</label>
                        <div class="w-48">
                            <input id="input_director_birth_year" placeholder="Enter year" type="number" min="1900" max="2099" class="input-box h-8 rounded-lg">
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Nationality</label>
                        <div class="w-48">
                            <input id="input_director_nationality" type="text" class="input-box h-8 rounded-lg">
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Name</label>
                        <div class="w-48">
                            <input id="input_director_name" type="text" class="input-box h-8 rounded-lg">
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <hr class="w-full max-w-5xl mx-auto my-12 border-t-2 border-gray-300">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-20 gap-y-12 items-start">
            <section>
                <h2 class="text-4xl font-bold mb-6 border-l-4 border-black pl-3 flex items-center">Genre</h2>
                <div class="space-y-4 pl-2 text-lg">
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Name</label>
                        <div class="w-48">
                            <input id="input_genre_name" type="text" class="input-box h-8 rounded-lg">
                        </div>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-4xl font-bold mb-6 border-l-4 border-black pl-3 flex items-center">Role</h2>
                <div class="space-y-4 pl-2 text-lg">
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Name</label>
                        <div class="w-48">
                            <input id="input_role_name" type="text" class="input-box h-8 rounded-lg">
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <hr class="w-full max-w-5xl mx-auto my-12 border-t-2 border-gray-300">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-20 gap-y-12 items-start">
            <section>
                <h2 class="text-4xl font-bold mb-6 border-l-4 border-black pl-3 flex items-center">Special Operation</h2>
                <div class="space-y-4 pl-2 text-lg">
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Actor-Director Combination</label>
                        <div class="w-48">
                            <div class="relative w-16">
                                <select id="input_actor_director_combination" class="hover:bg-gray-800 h-8 appearance-none w-full bg-black text-white px-2 py-0.5 rounded-lg text-xs border-none focus:outline-none cursor-pointer">
                                    <option value=""> NaN </option>
                                    <option value="1"> 1 </option>
                                    <option value="2"> 2 </option>
                                    <option value="3"> 3 </option>
                                    <option value="5"> 5 </option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-white">
                                    <svg class="w-3 h-3 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="font-bold">Top Rating of Year</label>
                        <div class="w-48 flex">
                            <div class="relative w-16 flex-none">
                                <select id="input_top_rating_limit" class="hover:bg-gray-800 h-8 appearance-none w-full bg-black text-white px-2 py-0.5 rounded-l-lg text-xs border-none focus:outline-none cursor-pointer">
                                    <option value=""> NaN </option>
                                    <option value="1"> 1 </option>
                                    <option value="2"> 2 </option>
                                    <option value="3"> 3 </option>
                                    <option value="4"> 4 </option>
                                    <option value="5"> 5 </option>
                                    <option value="10"> 10 </option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-white">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </div>
                            <input id="input_top_rating_year" placeholder="Enter year" type="number" min="1900" max="2099" class="input-box h-8 w-full rounded-l-none rounded-r-lg"> 
                        </div>                            
                    </div>
                </div>
            </section>
        </div>

        <div class="mt-20 flex justify-center">
            <div class="inline-flex rounded-full shadow-lg overflow-hidden">
                <button id="search_btn" class="bg-black text-white text-xl px-12 py-3 font-bold hover:bg-gray-800 transition active:scale-105">
                    Search
                </button>
                <div class="relative border-l border-gray-700 bg-black">
                    <select id="result_type_select" class="h-14 appearance-none bg-black text-white text-xl pl-6 pr-12 py-3 font-bold hover:bg-gray-800 transition cursor-pointer focus:outline-none">
                        <option value="movie">Movie</option>
                        <option value="actor">Actor</option>
                        <option value="genre">Genre</option>
                        <option value="role">Role</option>        
                        <option value="company">Company</option>
                        <option value="director">Director</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-white">
                        <svg class="w-3 h-3 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>
        </div>

        <section class="mt-16 w-full">
            <h2 class="text-4xl font-bold mb-6 border-l-4 border-black pl-3 flex items-center">Result</h2>
            <div id="result_container" class="w-full min-h-96 border border-gray-200 shadow-sm rounded-sm p-4 grid grid-cols-1 gap-4">
                <p class="text-gray-400 text-center mt-32">Search results will appear here...</p>
            </div>
        </section>
    </main>

    <script src="navbar.js"></script>
    <script>
        document.getElementById('search_btn').addEventListener('click', async () => {
            const API_BASE = 'http://127.0.0.1:8000';
            const resultType = document.getElementById('result_type_select').value;

            const getVal = (id) => {
                const el = document.getElementById(id);
                if (!el) return null;
                const val = el.value.trim();
                if (val === "" || val === "NaN") return null;
                return val;
            };

            const getInt = (id) => {
                const val = getVal(id);
                return val ? parseInt(val) : null;
            }

            // 建立 payload
            let payload = {
                result_type: getVal('result_type_select'),
                // Movie
                movie_language: getVal('input_movie_language'),
                movie_duration_op: getVal('input_movie_duration_op'),
                movie_duration_value: getInt('input_movie_duration_value'),
                movie_release_year: getInt('input_movie_release_year'),
                movie_director: getVal('input_movie_director'),
                movie_country: getVal('input_movie_country'),
                movie_title: getVal('input_movie_title'),

                // Actor
                actor_gender: getVal('input_actor_gender'),
                actor_birth_year: getInt('input_actor_birth_year'),
                actor_nationality: getVal('input_actor_nationality'),
                actor_name: getVal('input_actor_name'),

                // Company
                company_founded_year: getInt('input_company_founded_year'),
                company_name: getVal('input_company_name'),

                // Director
                director_birth_year: getInt('input_director_birth_year'),
                director_nationality: getVal('input_director_nationality'),
                director_name: getVal('input_director_name'),

                // Genre
                genre_name: getVal('input_genre_name'),

                // Role
                role_name: getVal('input_role_name'),

                // Special Operations
                actor_director_combination: getInt('input_actor_director_combination'),
                top_rating_of_year_limit: getInt('input_top_rating_limit'),
                top_rating_of_year: getInt('input_top_rating_year')
            };

            try {
                const r = await fetch(`${API_BASE}/advanced-search`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                if (!r.ok) {
                    const err = await r.json();
                    showAlert('failed', err.detail);
                    return;
                }

                const data = await r.json();
                renderResults(data);

            } catch (error) {
                showAlert('failed', error.detail);
            }
        });

        function renderResults(data) {
            const container = document.getElementById('result_container');
            container.innerHTML = ''; // 清空舊結果
            container.className = "w-full min-h-96 border border-gray-200 shadow-sm rounded-sm p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 auto-rows-min";

            // 輔助卡片產生器
            const createCard = (title, details, jump, type, id) => {
                const div = document.createElement('div');
                div.className = "bg-gray-50 p-4 rounded-lg shadow hover:shadow-md transition border border-gray-200";
                if(jump){
                    div.innerHTML = `
                    <a href = ${type}.html?${type}_id=${id} class="text-xl font-bold mb-2 truncate">${title}</a>
                    <div class="text-sm text-gray-600 space-y-1">
                        ${details.map(d => `<p>${d}</p>`).join('')}
                    </div>
                    `;
                }
                else{
                    div.innerHTML = `
                    <h3 class="text-xl font-bold mb-2 truncate">${title}</h3>
                    <div class="text-sm text-gray-600 space-y-1">
                        ${details.map(d => `<p>${d}</p>`).join('')}
                    </div>
                    `;
                }
                return div;
            };

            let hasData = false, jump = false;
            
            // A. Movie List
            if (data.movie_list && data.movie_list.length > 0) {
                hasData = true;
                jump = true;
                data.movie_list.forEach(m => {
                    const details = [
                        `Year: ${m.release_year}` || 'N/A',
                        `Duration: ${m.duration} min`  || 'N/A',
                        `Country: ${m.country}`  || 'N/A',
                        `Director ID: ${m.director_id}` || 'N/A',
                        `Language: ${m.language}` || 'N/A'
                    ];
                    container.appendChild(createCard(m.title, details, jump, 'movie', m.movie_id));
                });
            }

            // B. Actor List
            if (data.actor_list && data.actor_list.length > 0) {
                hasData = true;
                jump = true;
                data.actor_list.forEach(a => {
                    const details = [
                        `Gender: ${a.gender || 'N/A'}`,
                        `Birth: ${a.birth_year || 'N/A'}`,
                        `Nation: ${a.nationality || 'N/A'}`
                    ];
                    container.appendChild(createCard(a.name, details, jump, 'actor', a.actor_id));
                });
            }

            // C. Director List (可能會跟 Actor 一起出現)
            if (data.director_list && data.director_list.length > 0) {
                hasData = true;
                data.director_list.forEach(d => {
                    const details = [
                        `Role: Director`,
                        `Birth: ${d.birth_year || 'N/A'}`,
                        `Nation: ${d.nationality || 'N/A'}`
                    ];
                    container.appendChild(createCard(d.name, details));
                });
            }

            // D. Company List
            if (data.company_list && data.company_list.length > 0) {
                hasData = true;
                jump = true;
                data.company_list.forEach(c => {
                    const details = [
                        `Founded: ${c.founded_year || 'N/A'}`,
                        `Country: ${c.country || 'N/A'}`
                    ];
                    container.appendChild(createCard(c.name, details, jump, 'company', c.company_id));
                });
            }

            // E. Genre List
            if (data.genre_list && data.genre_list.length > 0) {
                hasData = true;
                data.genre_list.forEach(g => {
                    container.appendChild(createCard(g.name, [`ID: ${g.genre_id}`]));
                });
            }

            // F. Role List
            if (data.role_list && data.role_list.length > 0) {
                hasData = true;
                data.role_list.forEach(r => {
                    container.appendChild(createCard(r.name, [`ID: ${r.role_id}`]));
                });
            }

            // G. Actor-Director Combination List 
            if (data.actor_director_list && data.actor_director_list.length > 0) {
                hasData = true;
                data.actor_director_list.forEach(item => {                  
                    const title = `${item.actor.name} & ${item.director.name}`;
                    
                    const details = [
                        `Cooperation: ${item.collab_count} times`, // 顯示合作次數
                        `Director Nat.: ${item.director.nationality}`,
                        `Actor Nat.: ${item.actor.nationality}`,
                        `Actor Gender: ${item.actor.gender}`
                    ];
                    // 建立卡片
                    container.appendChild(createCard(title, details));
                });
            }

            if (!hasData) {
                container.className = "w-full min-h-96 border border-gray-200 shadow-sm rounded-sm p-4 flex items-center justify-center";
                container.innerHTML = `<p class="text-gray-500 text-xl">No results found.</p>`;
            }
        }
    </script>
</body>
</html>
